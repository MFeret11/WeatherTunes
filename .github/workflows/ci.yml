name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run browser tests
        # The tests are ES modules that run in a real browser (test/index.html).
        # Serve the repo, load the page in headless Chrome and read the result line.
        run: |
          python3 -m http.server 8090 >/dev/null 2>&1 &
          for i in $(seq 1 20); do curl -sf http://localhost:8090/ >/dev/null && break; sleep 0.5; done
          google-chrome --headless=new --no-sandbox --disable-gpu \
            --virtual-time-budget=60000 --dump-dom http://localhost:8090/test/ > result.html
          sed -n '/<pre id="out">/,/<\/pre>/p' result.html
          grep -q '<title>PASS' result.html

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
